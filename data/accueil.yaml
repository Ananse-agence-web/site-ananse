# Textes de la page d'accueil (modifiables dans /admin/, rubrique « Textes du site »)
hero:
  surtitre: Agence web
  titre_debut: On tisse
  titre_souligne: votre web
  titre_fin: .
  intro: Sites vitrines, applications et outils sur mesure, livrés en quelques jours plutôt qu'en quelques mois. Rapides, sans cookie, et faits pour durer.
  bouton: Demander un devis
  bouton2: Voir nos réalisations
chiffres:
  - valeur: 20 ans
    texte: d'expérience du web
  - valeur: Quelques jours
